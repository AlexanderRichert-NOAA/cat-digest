[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-digest"
version = "0.1.0"
description = "Consolidate Smartsheet and GitHub contributions into a text digest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "smartsheet-python-sdk>=3.0,<4",
    "PyGithub>=2.5,<3",
    "PyYAML>=6,<7",
    "questionary>=2.1,<3",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
cat-digest = "cat_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cat_digest = ["llm.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
